<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FactGuard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Google Sans', sans-serif; background: #0f1117; color: #e8eaf6; }

    #header {
      padding: 16px;
      background: #1a1d2e;
      border-bottom: 1px solid #2a2d3e;
      display: flex; align-items: center; gap: 10px;
    }
    #header h1 { font-size: 18px; font-weight: 600; color: #7c83fd; }
    #header span { font-size: 12px; color: #666; }

    #check-btn {
      margin: 16px;
      width: calc(100% - 32px);
      padding: 12px;
      background: #7c83fd;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #check-btn:hover { background: #6b72f0; }
    #check-btn:disabled { background: #444; cursor: not-allowed; }

    #status {
      margin: 0 16px;
      font-size: 13px;
      color: #888;
      min-height: 20px;
    }

    #trust-score-bar {
      margin: 16px;
      display: none;
    }
    #trust-score-bar .label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
      color: #aaa;
    }
    #trust-bar-fill {
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(90deg, #f44336, #ff9800, #4caf50);
      width: 0%;
      transition: width 0.5s ease;
    }

    #claims-list { padding: 16px; display: flex; flex-direction: column; gap: 10px; }

    .claim-card {
      background: #1a1d2e;
      border-radius: 10px;
      padding: 12px;
      border-left: 4px solid #444;
      animation: slideIn 0.3s ease;
    }
    .claim-card.SUPPORTED   { border-left-color: #4caf50; }
    .claim-card.CONTRADICTED { border-left-color: #f44336; }
    .claim-card.UNVERIFIABLE { border-left-color: #ff9800; }

    .claim-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .claim-verdict {
      font-size: 11px; font-weight: 700; padding: 2px 8px;
      border-radius: 12px; text-transform: uppercase;
    }
    .SUPPORTED .claim-verdict   { background: #1b5e20; color: #a5d6a7; }
    .CONTRADICTED .claim-verdict { background: #b71c1c; color: #ffcdd2; }
    .UNVERIFIABLE .claim-verdict { background: #e65100; color: #ffe0b2; }

    .claim-text { font-size: 13px; line-height: 1.5; color: #ccc; margin-bottom: 8px; }
    .claim-confidence { font-size: 11px; color: #666; }

    .sources { margin-top: 8px; }
    .source-item { font-size: 11px; color: #7c83fd; text-decoration: none; display: block;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #summary-box {
      margin: 16px;
      background: #1a1d2e;
      border-radius: 10px;
      padding: 14px;
      display: none;
    }
    #summary-box h3 { font-size: 13px; color: #7c83fd; margin-bottom: 8px; }
    #summary-text { font-size: 13px; color: #ccc; line-height: 1.6; }
    #share-verdict { margin-top: 10px; font-size: 12px; font-weight: 700; }
    .safe     { color: #4caf50; }
    .caution  { color: #ff9800; }
    .danger   { color: #f44336; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>🔍 FactGuard</h1>
    <span>Multi-Agent Fact Checker</span>
  </div>

  <button id="check-btn">Check This Page</button>
  <div id="status">Ready. Click to fact-check the current page.</div>

  <div id="trust-score-bar">
    <div class="label">
      <span>Overall Trust Score</span>
      <span id="score-label">—</span>
    </div>
    <div id="trust-bar-bg" style="height:8px;background:#333;border-radius:4px;">
      <div id="trust-bar-fill"></div>
    </div>
  </div>

  <div id="claims-list"></div>
  <div id="summary-box">
    <h3>📋 Trust Report</h3>
    <p id="summary-text"></p>
    <p id="share-verdict"></p>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
